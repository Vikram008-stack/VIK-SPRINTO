# Sprinto outreach pipeline - runtime config.
# Every cap here is enforced in code and logged. Change values, not code.
version: 1

run:
  concurrency: 3                 # companies processed in parallel; Hunter + Gmail calls are serialised
  max_cost_usd_per_company: 0.05 # breach -> INSUFFICIENT_DATA, reason budget_exceeded
  max_seconds_per_company: 120   # matches the under-2-minute design target
  per_domain_delay_s: 2.0        # politeness delay between fetches to the same domain

scrape:
  provider: scrapingbee
  cache_ttl_days: 7              # never refetch the same URL inside this window
  max_fetches_per_company: 5     # homepage + up to 4 (includes loop fetches)
  js_escalation_min_words: 200   # cleaned text below this -> retry with render_js=true
  timeout_s: 30
  respect_robots: true
  robots_user_agent: "*"         # robots.txt group we honour (ScrapingBee does not identify us)
  credits:                       # ScrapingBee docs: render_js=true costs 5; classic (no JS) costs 1
    plain: 1
    js: 5
  usd_per_credit: 0.000196       # ESTIMATE: Freelance plan $49 / 250k credits. Set to your plan.
  transport: scrapingbee         # scrapingbee | direct (dev only: plain HTTP, 0 credits, robots still enforced)

cleaner:
  max_tokens_per_group: 2000     # token estimate = chars / 4
  min_line_words: 8              # shorter lines dropped unless they are headings

llm:
  provider: gemini
  # Model ids + prices checked on aistudio.google.com/docs/pricing on 2026-11-14.
  models:
    extract: gemini-3.1-flash-lite   # cheapest Gemini 3 tier: extraction + loop re-extraction
    # 2026-11-18: gemini-3.6-flash returned 503/504 (overloaded) in the live smoke test -> 3.8-flash, same price
    qualify: gemini-3.5-flash-lite   # advisory score proposal only (Python decides): fast + reliable
    pain: gemini-3.8-flash
    draft: gemini-3.8-flash
    search: gemini-3.8-flash         # grounded Google Search (needs a paid-tier key for Gemini 3)
  fallback_model: gemini-3.5-flash-lite   # tried if the task model stays overloaded after retries
  fallback_models: [gemini-3.1-flash-lite]   # then these, in order (live 2026-11-19: 3.8-flash 503s)
  thinking_level: null               # leave null unless the model documents thinking_level
  temperature: 0.2
  max_retries: 1                     # one retry, then the fallback model (live: overloaded models stalled 3 min)
  timeout_s: 25
  # USD per 1M tokens (paid tier). Unknown model -> cost recorded as null, never guessed.
  # NOTE gemini-3.6-flash doubles to $1.50/$7.50 on 2027-01-01.
  pricing_usd_per_1m:
    gemini-3.1-flash-lite: {input: 0.25, output: 1.50}
    gemini-3.6-flash: {input: 0.75, output: 3.75}
    gemini-3.8-flash: {input: 0.75, output: 3.75}
    gemini-3.5-flash-lite: {input: 0.30, output: 2.50}
    gemini-4-hydrogen: {input: 1.50, output: 7.50}
  # Grounding: first 5,000 grounded requests/month free on paid tier, then $14 / 1,000 ($0.014 each).
  # Marginal cost inside the free allowance is 0; set to 0.014 to budget conservatively.
  grounding_usd_per_request: 0.0
  prompt_versions:
    extract: v1
    qualify: v1
    research: v1
    pain: v1
    draft: v1

search:
  provider: gemini_grounded      # gemini_grounded | serper
  max_searches_per_company: 3
  cache_ttl_days: 7
  loop_may_search: true          # the qualification loop may spend 1 of the 3 searches on the trigger row

hunter:
  mode: mock                     # mock | live ; live also requires the --live-hunter CLI flag
  monthly_budget: 25
  hard_stop: 20                  # refuse live searches beyond this (5 kept for emergencies)
  verifier: true                 # Email Verifier on the chosen contact only, if credits remain
  verifier_monthly_budget: 50
  min_confidence: 70
  results_limit: 10
  # Parameter names/values confirmed against Hunter docs at milestone 6.
  filters:
    department: [executive, it, management]
    seniority: [senior, executive]
    type: personal
  allow_role_mailbox_fallback: false

contacts:
  manual_contacts_file: config/manual_contacts.yaml

qualification:
  already_certified_policy: research   # research (rubric v1) | disqualify (stricter L4 slide variant)
  max_extra_rounds: 2

email:
  mode: dry_run                  # dry_run | send ; send also requires the --send CLI flag
  max_words: 120
  word_tolerance: 0.10           # "under about 120": hard fail above 132
  max_em_dashes: 0
  guardrail_max_attempts: 2
  sender_name: "Vikram"
  sprinto_context: >-
    Sprinto automates SOC 2, ISO 27001 and GDPR readiness and audits for SaaS teams:
    continuous control monitoring, evidence collection and auditor-ready reporting.

paths:
  db: data/outreach.db
  cache: data/cache
  logs: data/logs
  reports: reports
