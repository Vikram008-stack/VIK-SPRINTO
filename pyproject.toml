[project]
name = "sprinto-outreach"
version = "0.1.0"
description = "Evidence-first cold-outreach pipeline for Sprinto (MESA Cohort 4, Term 2, Build 2)"
requires-python = ">=3.11"
# Runtime dependencies (Vercel installs these from pyproject.toml; keep in sync with requirements.txt)
dependencies = [
    "pydantic>=2.7,<3",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "google-genai>=1.0",
    "fastapi>=0.110",
]

[project.optional-dependencies]
dev = ["typer>=0.12", "rich>=13.7", "uvicorn>=0.29", "pytest>=8.2", "google-auth-oauthlib>=1.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live'"
markers = [
    "live: calls real external APIs (skipped by default; run with -m live)",
]
